name: Build test

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            dependencies:
              - 'pyproject.toml'
              - 'scripts/klippy-requirements.txt'
              - 'scripts/requirements_dev.txt'

      - name: Build docker image
        run: |
          # Clean up docker output so that github ::group: instructions
          # get recognized
          stdbuf -oL -eL docker build --progress=plain -f scripts/Dockerfile-build \
            -t klipper-build:latest . 2>&1 \
            | sed -u -E 's/^#[0-9]+ [0-9.]+ ?//g'

      - name: Ensure the exported requirements files are up to date
        if: steps.changes.outputs.dependencies == 'true'
        uses: nickcharlton/diff-check@main
        with:
          command: |
            docker run -v $PWD:/klipper klipper-build:latest uv export --frozen -o scripts/klippy-requirements.txt --no-dev --no-hashes
            docker run -v $PWD:/klipper klipper-build:latest uv export --frozen -o scripts/requirements_dev.txt --only-dev --no-hashes

      # Klippy tests across all supported Python versions. Each step runs the
      # SAME command as `./scripts/ci.sh py <ver>` locally (one source of truth).
      - name: Test Klippy (Python 3.9)
        run: ./scripts/ci.sh py 3.9
      - name: Test Klippy (Python 3.10)
        run: ./scripts/ci.sh py 3.10
      - name: Test Klippy (Python 3.11)
        run: ./scripts/ci.sh py 3.11
      - name: Test Klippy (Python 3.12)
        run: ./scripts/ci.sh py 3.12
      - name: Test Klippy (Python 3.13)
        run: ./scripts/ci.sh py 3.13
      - name: Test Klippy (Python 3.14)
        run: ./scripts/ci.sh py 3.14

  # `ci.sh run_all` includes both of these, but neither was reachable from any
  # workflow: py-typecheck ran nowhere at all, which is how it went its whole
  # life pointing at three files that never existed, and the CI-able sim unit
  # subset was left to `ci.sh sim` that nothing called — pyproject's testpaths
  # deliberately exclude tools/, so the `py` job above does not cover it and
  # the advisory sim-e2e workflow runs a different suite.
  py-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Typecheck the annotated modules
        run: ./scripts/ci.sh py-typecheck

  sim-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run the sim unit subset
        run: ./scripts/ci.sh sim
